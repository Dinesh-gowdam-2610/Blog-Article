# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  .github/workflows/daily-post.yml                                          ║
# ║  Publishes one AI-generated blog post every weekday at 08:00 AM IST        ║
# ║  Skips Saturday and Sunday automatically (cron: Mon–Fri only)              ║
# ║  Calls: scripts/devCommunityBlogPost.js                                    ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║  08:00 AM IST  =  02:30 UTC  (IST is UTC +5:30)                           ║
# ║  Cron field breakdown:  30 2 * * 1-5                                       ║
# ║    30   → minute 30                                                        ║
# ║    2    → hour 02 (UTC)  ← 02:30 UTC + 5h30m = 08:00 AM IST              ║
# ║    *    → every day of month                                               ║
# ║    *    → every month                                                      ║
# ║    1-5  → Monday(1) through Friday(5) only — skips Sat(6) and Sun(0/7)   ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║  ACTION VERSIONS (Node.js 24 compatible — updated May 2025):               ║
# ║    actions/checkout@v4.2.2   → uses Node.js 24 internally                 ║
# ║    actions/setup-node@v4.4.0 → uses Node.js 24 internally                 ║
# ║  GitHub is forcing Node.js 24 for all actions from June 2nd 2026.         ║
# ║  These versions are already compatible — no breaking changes expected.    ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║  SECRET PROTECTION:                                                        ║
# ║  • API keys stored ONLY in GitHub Encrypted Secrets — never in code        ║
# ║  • Injected as env vars at runtime — never as CLI args                     ║
# ║  • GitHub auto-masks any accidental leak in logs as ***                    ║
# ║  • Minimum permissions: contents: write (to commit post-history.json)      ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║  REQUIRED SECRETS  (Settings → Secrets and variables → Actions):           ║
# ║    GROQ_API_KEY          → https://console.groq.com                        ║
# ║    DEVTO_API_KEY         → https://dev.to/settings/extensions              ║
# ║                                                                            ║
# ║  OPTIONAL — LinkedIn (add to enable LinkedIn notifications):               ║
# ║    LINKEDIN_ACCESS_TOKEN → OAuth token (expires every 60 days)            ║
# ║    LINKEDIN_PERSON_URN   → urn:li:person:YOUR_ID (from /v2/userinfo sub)  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: 📅 Weekday Blog Post (8 AM IST)

on:
  schedule:
    # Target : 08:00 AM IST (Asia/Kolkata) every weekday
    # Formula: IST - 5h30m = UTC  →  08:00 - 5:30 = 02:30 UTC (same day)
    #
    #        ┌─ minute (30)  ← IST is UTC+5:30, so minute must be 30
    #        │  ┌─ hour (02) ← 08:00 AM IST - 5h30m = 02:30 UTC
    #        │  │  ┌─ day of month (every)
    #        │  │  │  ┌─ month (every)
    #        │  │  │  │  ┌─ day of week: 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri
    #        │  │  │  │  │
    - cron: "30 2 * * 1-5"    # 08:00 AM IST · 02:30 UTC · Mon–Fri

  # Adds the "Run workflow" button in the GitHub Actions tab for manual testing
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — generate and SEO-score but do NOT publish to Dev.to"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

# Workflow-level env:
#   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 — opts into Node.js 24 now to avoid the
#     deprecation warning GitHub started showing for Node.js 20 actions.
#   TZ=Asia/Kolkata — all `date` commands, logs, timestamps render in IST.
#     NOTE: GitHub cron always runs in UTC — TZ does NOT change cron timing.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Kolkata

# contents: write needed to commit post-history.json back to the repo
permissions:
  contents: write

# One run at a time — if somehow two triggers fire, cancel the older one
concurrency:
  group: weekday-blog-post
  cancel-in-progress: true

jobs:
  publish:
    name: Generate & Publish Weekday Post
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      # actions/checkout@v4.2.2 — Node.js 24 compatible (updated May 2025)
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}

      # ── 2. Node.js ─────────────────────────────────────────────────────────
      # actions/setup-node@v4.4.0 — Node.js 24 compatible (updated May 2025)
      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          # No npm install — script uses only Node built-ins + fetch API

      # ── 3. Validate secrets (checks presence only, never prints values) ────
      - name: 🔐 Validate secrets
        env:
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          MISSING=()
          if [ -z "$GROQ_API_KEY" ]; then
            MISSING+=("GROQ_API_KEY")
          else
            echo "✅ GROQ_API_KEY is set (length: ${#GROQ_API_KEY} chars)"
          fi
          if [ -z "$DEVTO_API_KEY" ]; then
            MISSING+=("DEVTO_API_KEY")
          else
            echo "✅ DEVTO_API_KEY is set (length: ${#DEVTO_API_KEY} chars)"
          fi
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo ""
            echo "❌ Missing required secrets: ${MISSING[*]}"
            echo "   Add them at: Settings → Secrets and variables → Actions"
            echo "   GROQ_API_KEY   → https://console.groq.com"
            echo "   DEVTO_API_KEY  → https://dev.to/settings/extensions"
            exit 1
          fi
          echo ""
          echo "🔒 Secrets validated. Values are encrypted and will not appear in logs."

      # ── 4. Run the publisher ───────────────────────────────────────────────
      # Secrets injected ONLY as env vars — never as CLI arguments.
      # (CLI args show up in `ps aux`; env vars do not.)
      - name: 🚀 Run devCommunityBlogPost.js
        env:
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}             # ← encrypted, masked in logs
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}            # ← encrypted, masked in logs
          # LinkedIn — optional. If not set, LinkedIn step is skipped gracefully.
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN:   ${{ secrets.LINKEDIN_PERSON_URN }}
          DRY_RUN:       ${{ github.event.inputs.dry_run || 'false' }}
          NODE_ENV:      production
        run: node scripts/devCommunityBlogPost.js

      # ── 5. Commit history file back to repo ────────────────────────────────
      # post-history.json is updated by the script after each successful post.
      # Committing it back means the NEXT run knows what was already published.
      #
      # FIX: GitHub Actions checks out in detached HEAD state.
      # "git push" alone fails with "not currently on a branch".
      # Solution: explicitly checkout main before pushing.
      - name: 💾 Commit post-history.json
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Re-attach HEAD to main branch so push works correctly
          git fetch origin main
          git checkout main

          git add logs/post-history.json

          # Only commit if the file actually changed — skip if nothing new
          git diff --staged --quiet || git commit -m "chore: update post-history.json [skip ci]"

          # Push explicitly to origin main — avoids detached HEAD push error
          git push origin main

      # ── 6. Job summary (zero secrets referenced here) ──────────────────────
      - name: 📋 Job summary
        if: always()
        run: |
          {
            echo "## 📅 Weekday Blog Post — ${{ job.status }}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| 📅 Date (IST) | $(date '+%Y-%m-%d %H:%M IST') |"
            echo "| 🕙 Schedule   | Mon–Fri · 08:00 AM IST (02:30 UTC) |"
            echo "| ✅ Status | ${{ job.status }} |"
            echo "| 🖥️ Runner | ubuntu-latest |"
            echo "| ⚙️ Actions runtime | Node.js 24 (FORCE_JAVASCRIPT_ACTIONS_TO_NODE24) |"
            echo ""
            echo "> 🔒 No API keys or secrets appear in this summary or any log above."
          } >> "$GITHUB_STEP_SUMMARY"
