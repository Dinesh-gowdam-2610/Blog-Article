# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  .github/workflows/daily-post.yml                                          ║
# ║  Publishes one post every weekday at 10:00 AM IST        ║
# ║  Skips Saturday and Sunday automatically (cron: Mon–Fri only)              ║
# ║  Calls: scripts/devCommunityBlogPost.js                                    ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║  10:00 AM IST  =  04:30 UTC  (IST is UTC +5:30)                           ║
# ║  Cron field breakdown:  30 4 * * 1-5                                       ║
# ║    30   → minute 30                                                        ║
# ║    4    → hour 04 (UTC)                                                    ║
# ║    *    → every day of month                                               ║
# ║    *    → every month                                                      ║
# ║    1-5  → Monday(1) through Friday(5) only — skips Sat(6) and Sun(0/7)    ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║  SECRET PROTECTION:                                                        ║
# ║  • API keys stored ONLY in GitHub Encrypted Secrets — never in code        ║
# ║  • Injected as env vars at runtime — never as CLI args                     ║
# ║  • GitHub auto-masks any accidental leak in logs as ***                    ║
# ║  • Minimum permissions: contents: read only                                ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║  REQUIRED SECRETS  (Settings → Secrets and variables → Actions):           ║
# ║    GROQ_API_KEY   → https://console.groq.com                               ║
# ║    DEVTO_API_KEY  → https://dev.to/settings/extensions                     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: 📅 Weekday Blog Post (10 AM IST)

on:
  schedule:
    #        ┌─ minute (30)
    #        │  ┌─ hour in UTC (04 = 09:30 IST... wait, 04:30 UTC = 10:00 IST)
    #        │  │  ┌─ day of month (every)
    #        │  │  │  ┌─ month (every)
    #        │  │  │  │  ┌─ day of week: 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri
    #        │  │  │  │  │
    - cron: "30 4 * * 1-5"    # Mon–Fri · 04:30 UTC · 10:00 AM IST

# Minimum permissions — read the repo, nothing else
permissions:
  contents: read

# One run at a time — if somehow two triggers fire, cancel the older one
concurrency:
  group: weekday-blog-post
  cancel-in-progress: true

jobs:
  publish:
    name: Generate & Publish Weekday Post
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # ── 2. Node.js ─────────────────────────────────────────────────────────
      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No npm install — script uses only Node built-ins + fetch API

      # ── 3. Validate secrets (checks presence only, never prints values) ────
      - name: 🔐 Validate secrets
        env:
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          MISSING=()
          if [ -z "$GROQ_API_KEY" ]; then
            MISSING+=("GROQ_API_KEY")
          else
            echo "✅ GROQ_API_KEY is set (length: ${#GROQ_API_KEY} chars)"
          fi
          if [ -z "$DEVTO_API_KEY" ]; then
            MISSING+=("DEVTO_API_KEY")
          else
            echo "✅ DEVTO_API_KEY is set (length: ${#DEVTO_API_KEY} chars)"
          fi
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo ""
            echo "❌ Missing required secrets: ${MISSING[*]}"
            echo "   Add them at: Settings → Secrets and variables → Actions"
            echo "   GROQ_API_KEY   → https://console.groq.com"
            echo "   DEVTO_API_KEY  → https://dev.to/settings/extensions"
            exit 1
          fi
          echo ""
          echo "🔒 Secrets validated. Values are encrypted and will not appear in logs."

      # ── 4. Run the publisher ───────────────────────────────────────────────
      # Secrets injected ONLY as env vars — never as CLI arguments
      # (CLI args are visible in `ps aux`; env vars are not)
      - name: 🚀 Run devCommunityBlogPost.js
        env:
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}    # ← encrypted secret, masked in logs
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}   # ← encrypted secret, masked in logs
          NODE_ENV:      production
        run: node scripts/devCommunityBlogPost.js

      # ── 5. Job summary (zero secrets referenced here) ──────────────────────
      - name: 📋 Job summary
        if: always()
        run: |
          {
            echo "## 📅 Weekday Blog Post — ${{ job.status }}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| 📅 Date (UTC) | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| 🕙 Local time | 10:00 AM IST |"
            echo "| ✅ Status | ${{ job.status }} |"
            echo "| 🖥️ Runner | ubuntu-latest |"
            echo "| 📆 Schedule | Mon–Fri only (no weekends) |"
            echo ""
            echo "> 🔒 No API keys or secrets appear in this summary or any log above."
          } >> "$GITHUB_STEP_SUMMARY"
